<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160812">
  <meta name="description" content="Press the button and watch JavaScript draw a heart.">
  <title>Heart Button</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C20 66 5 46 5 29a22 22 0 0 1 45-9 22 22 0 0 1 45 9c0 17-15 37-45 59z' fill='%23ff4f8b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Draw a heart</h1>
    <button id="heart-button" class="heart-button" type="button" aria-label="Draw a heart" aria-describedby="hint">
      <canvas id="heart-canvas" aria-hidden="true"></canvas>
    </button>
    <p id="hint" class="hint" aria-live="polite">Click the button to draw a heart</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
